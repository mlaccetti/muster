name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v2
        with:
          install: true

      - name: Verify Go module at tag
        run: |
          go list -m -json "github.com/mlaccetti/muster@${GITHUB_REF_NAME}"

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Verify release binary reports tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          tar -xzf dist/muster_*_linux_amd64.tar.gz
          OUT="$(./muster --version | head -1)"
          case "$OUT" in
            "${TAG}"*) echo "version ok: $OUT" ;;
            *) echo "expected prefix ${TAG}, got: $OUT"; exit 1 ;;
          esac
