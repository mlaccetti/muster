version: 2

project_name: muster

before:
  hooks:
    - go mod tidy
    - go test ./... -race -count=1

builds:
  - id: muster
    main: ./cmd/muster
    binary: muster
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - formats: [tar.gz]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"

release:
  github:
    owner: mlaccetti
    name: muster
  draft: false
  prerelease: auto

brews:
  - name: muster
    repository:
      owner: mlaccetti
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/mlaccetti/muster"
    description: "Harness-neutral briefs, workers, and routing for coding agents"
    license: "MIT"
    install: |
      bin.install "muster"
    test: |
      system "#{bin}/muster", "--version"
